# Throwaway local WordPress for test_wp.py. Local-only test values; nothing here is a real credential.
name: consent-kit-test
x-wp-env: &wpenv
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: root
  WORDPRESS_DB_PASSWORD: localtest
  WORDPRESS_DB_NAME: wp
  # "local" lets application passwords work over plain http, and points the updater at the test server.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'CONSENT_KIT_UPDATE_URL', 'http://releases/update.json' );
    define( 'CONSENT_KIT_PACKAGE_PREFIX', 'http://releases/' );
services:
  # Stands in for GitHub releases in the self-update test.
  releases:
    image: nginx:alpine
    volumes:
      - ./releases:/usr/share/nginx/html:ro
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: localtest
      MARIADB_DATABASE: wp
  wordpress:
    image: wordpress:6-php8.2-apache
    depends_on: [db]
    ports: ["8089:80"]
    environment: *wpenv
    volumes:
      - html:/var/www/html
      - ./old-plugin/azvai-consent:/var/www/html/wp-content/plugins/azvai-consent
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on: [wordpress]
    environment: *wpenv
    volumes:
      - html:/var/www/html
      - ./old-plugin/azvai-consent:/var/www/html/wp-content/plugins/azvai-consent
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../../dist:/dist:ro
volumes:
  html:
